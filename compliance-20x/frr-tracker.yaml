# FedRAMP 20x FRR (FedRAMP Rules) tracker — the process-rule counterpart to
# ksi-tracker.yaml. One entry per FRR rule from
# compliance-20x/data/fedramp-consolidated-rules.json that has affects:
# [Providers] (i.e. rules this project, as the CSO, would have to satisfy —
# not the FedRAMP- or Agency-facing rules in the same categories).
#
# Scoped to the five categories CLAUDE.md called out as the FRR follow-up:
# vulnerability disclosure (VDR, VER), incident communication (IEC),
# continuous monitoring (CCM), and change notification (SCN). The other 12
# FRR categories (AFC, AGU, CDS, CMU, CPO, FRC, IVV, MAS, MKT, REC, SCG, SDR)
# are not covered here yet.
#
# status: not_started | in_progress | implemented
# policy: path to a Rego file enforcing this rule, if any (none yet — these
#   are process/reporting rules, not app-config settings like
#   policy/fedramp_20x/app_config.rego checks)
# evidence: short notes on what demonstrates this rule is met
#
# Target Certification Class: C (decided; see CLAUDE.md). Some rules exist
# in the dataset only as class-specific variants (no top-level statement,
# just varies_by_class: {a, b, c, d}) — for those, this tracker's "force"
# and notes reflect the Class C variant specifically, since that's the
# class this project applies. Browse the raw variants with
# `frr.py show <ID>`.
#
# Overall finding: almost every rule in these five categories presumes an
# actual FedRAMP Certification already exists — a real Certification Class,
# real agency customers to notify, a real Certification Package to publish
# Ongoing Certification Reports/Quarterly Reviews/Significant Change
# Notifications into. A demo repo with no ATO and no agency customers has
# no "necessary parties" to report to, so almost all of CCM and most of
# VER/IEC/SCN are honestly not_started for that one structural reason. The
# exception is VDR's detection/response rules, which don't require a
# Certification to be true today: Dependabot is a real, running vulnerability
# detection and response mechanism regardless of certification status, so
# those three move to in_progress on the same evidence already used for
# KSI-SCR-MON/KSI-SCR-MIT in ksi-tracker.yaml.
#
# Check coverage with: python compliance-20x/tools/frr.py tracker-status

# --- VDR: Vulnerability Detection and Response ---

VDR-CSO-ADT:
  category: Vulnerability Detection and Response
  force: SHOULD
  name: Automate Detection
  status: in_progress
  policy: null
  evidence:
  - Dependabot (.github/dependabot.yml) automatically scans uv + GitHub
    Actions dependencies and opens PRs — confirmed live, 38 alerts surfaced
    (21 high) after the first push.
  notes: ''

VDR-CSO-AKE:
  category: Vulnerability Detection and Response
  force: SHOULD NOT
  name: Avoid KEVs
  status: not_started
  policy: null
  evidence: []
  notes: No deployed machine-based information resources exist yet to check
    against the CISA KEV catalog.

VDR-CSO-DAC:
  category: Vulnerability Detection and Response
  force: SHOULD
  name: Detect After Changes
  status: not_started
  policy: null
  evidence: []
  notes: CI runs tests and policy checks on every push, but nothing scans for
    vulnerabilities specifically triggered by a change (Dependabot runs on
    its own schedule, not per-PR). Would need a dependency/SAST scan step
    added to .github/workflows/ci.yml.

VDR-CSO-DET:
  category: Vulnerability Detection and Response
  force: MUST
  name: Vulnerability Detection
  status: in_progress
  policy: null
  evidence:
  - Dependabot dependency + Actions scanning is real, running vulnerability
    detection — same evidence as KSI-SCR-MON.
  notes: Only covers dependency vulnerabilities. No scanning, threat intel,
    pentesting, or bug bounty coverage of anything else (there's no deployed
    infra to scan).

VDR-CSO-DFR:
  category: Vulnerability Detection and Response
  force: SHOULD
  name: Design For Resilience
  status: not_started
  policy: null
  evidence: []
  notes: Architecture-level principle; nothing to evidence without a real
    deployment target and design decisions made against it.

VDR-CSO-FAV:
  category: Vulnerability Detection and Response
  force: MUST
  name: Failures Are Vulnerabilities
  status: not_started
  policy: null
  evidence: []
  notes: Requires an existing detection/response process mature enough to
    have failures worth tracking as vulnerabilities. Nothing to evidence yet
    beyond Dependabot, which hasn't failed.

VDR-CSO-MSP:
  category: Vulnerability Detection and Response
  force: SHOULD NOT
  name: Maintain Security
  status: not_started
  policy: null
  evidence: []
  notes: No active scanning/assessment program exists yet that could weaken
    security to facilitate itself.

VDR-CSO-RES:
  category: Vulnerability Detection and Response
  force: MUST
  name: Vulnerability Response
  status: in_progress
  policy: null
  evidence:
  - Dependabot automatically opens update PRs for detected vulnerabilities,
    which are tracked, evaluated, and merged through the normal PR process —
    same evidence as KSI-SCR-MIT.
  notes: Response is currently ad hoc (whoever reviews the Dependabot PR),
    not a documented, systematic process. No mitigation/remediation SLA,
    exploitation monitoring, or reporting yet.

VDR-CSO-SIR:
  category: Vulnerability Detection and Response
  force: MAY
  name: Sampling
  status: not_started
  policy: null
  evidence: []
  notes: No fleet of similar machine-based resources exists to sample.

VDR-TFR-MVX:
  category: Vulnerability Detection and Response
  force: MUST
  name: Persistent Machine Verification and Validation for 20x
  status: not_started
  policy: null
  evidence: []
  notes: >-
    Class C variant (this project's target class, see CLAUDE.md): MUST
    verify and validate the status of machine-based information resources
    at least every 3 days. No deployed machine-based infrastructure exists
    yet to verify/validate on any cadence.

VDR-TFR-PCD:
  category: Vulnerability Detection and Response
  force: SHOULD
  name: Persistently Complete Detection
  status: not_started
  policy: null
  evidence: []
  notes: >-
    Class C variant: SHOULD persistently detect vulnerabilities on all
    resources NOT likely to drift, at least monthly. No deployed
    infrastructure exists yet to run this detection against.

VDR-TFR-PDD:
  category: Vulnerability Detection and Response
  force: SHOULD
  name: Persistent Drift Detection
  status: not_started
  policy: null
  evidence: []
  notes: >-
    Class C variant: SHOULD persistently detect vulnerabilities on
    resources likely to drift, at least every 14 days. Dependabot's own
    schedule doesn't map to this cadence, and there's no deployed
    infrastructure with a notion of "likely to drift" yet.

VDR-TFR-PSD:
  category: Vulnerability Detection and Response
  force: SHOULD
  name: Persistent Sample Detection
  status: not_started
  policy: null
  evidence: []
  notes: >-
    Class C variant: SHOULD sample-detect on similar machine-based
    resources at least every 3 days. No fleet of similar machine-based
    resources exists yet to sample.

VDR-TFR-PVR:
  category: Vulnerability Detection and Response
  force: SHOULD
  name: Mitigation and Remediation Expectations
  status: not_started
  policy: null
  evidence: []
  notes: Requires a PAIN-rating methodology (VER-EVA-EPA) and defined
    mitigation/remediation timeframes; neither exists yet.

VDR-TFR-KEV:
  category: Vulnerability Detection and Response
  force: SHOULD
  name: Remediate KEVs
  status: not_started
  policy: null
  evidence: []
  notes: No deployed infra exposed to KEV risk, and no process yet for
    checking Dependabot alerts against the CISA KEV catalog specifically.

VDR-TFR-NMV:
  category: Vulnerability Detection and Response
  force: MUST
  name: Non-Machine Verification and Validation
  status: not_started
  policy: null
  evidence: []
  notes: No non-machine-based information resources (or a defined inventory
    of them) exist yet to verify/validate on a recurring cadence.

VDR-TFR-RMN:
  category: Vulnerability Detection and Response
  force: SHOULD
  name: Remaining Vulnerabilities
  status: not_started
  policy: null
  evidence: []
  notes: No "routine operations" exist yet (nothing is deployed/operated) in
    which to mitigate remaining vulnerabilities.

