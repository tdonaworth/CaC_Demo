# FedRAMP 20x KSI tracker — the lightweight, per-indicator status record that
# stands in for a heavyweight point-in-time SSP under the 20x model. One entry
# per Key Security Indicator from compliance-20x/data/fedramp-consolidated-rules.json.
#
# status: not_started | in_progress | implemented
# policy: path to the Rego file enforcing this indicator, if any
# evidence: short notes on what demonstrates this indicator is met
#
# Regenerate the not_started skeleton (preserving hand-edited entries is your
# job, this is a starting point) via the dataset in data/, or check coverage
# with: python compliance-20x/tools/ksi.py tracker-status

KSI-CED-RAT:
  theme: Cybersecurity Education
  name: Reviewing All Training
  status: not_started
  policy: null
  evidence: []
  notes: Needs a real training program (general + role-specific + secure-SDLC + IR training) and a review
    cadence. Nothing to evidence in a demo repo with no employees.
KSI-CMT-LMC:
  theme: Change Management
  name: Logging Changes
  status: in_progress
  policy: null
  evidence:
  - Git commit/PR history is the log of source changes
  - .github/workflows/ci.yml run history logs every check on every change
  notes: No cloud/infrastructure audit log yet since nothing is deployed to real infra. Revisit once there's
    an actual deployment target.
KSI-CMT-RMV:
  theme: Change Management
  name: Redeploying vs Modifying
  status: not_started
  policy: null
  evidence: []
  notes: Needs an actual deployment mechanism (e.g. containerized, deployed only via CI, no direct server
    modification) before this can be evidenced. See docs/change-management.md known gaps.
KSI-CMT-RVP:
  theme: Change Management
  name: Reviewing Change Procedures
  status: not_started
  policy: null
  evidence: []
  notes: docs/change-management.md is a draft procedure, but no review cadence exists yet and none has
    run. Don't mark in_progress/implemented until a real recurring review happens.
KSI-CMT-VTD:
  theme: Change Management
  name: Validating Throughout Deployment
  status: in_progress
  policy: null
  evidence:
  - .github/workflows/ci.yml runs pytest, opa test, and the 20x dataset validator on every push/PR
  notes: Workflow exists in code but hasn't run in a live GitHub Actions environment yet (repo has no
    remote). Confirm it actually runs green once pushed before calling this implemented.
