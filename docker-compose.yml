# Local dev: the app plus a Postgres like the one RDS provides in AWS.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: localdev-only
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:localdev-only@db:5432/app
      API_KEYS: local-dev-key
      APP_ENVIRONMENT: development
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
