name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPA_VERSION: "1.20.2"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: uv sync

      - name: Run app tests
        run: uv run pytest

      - name: Validate FedRAMP 20x dataset against its schema
        run: uv run python compliance-20x/tools/validate_dataset.py

      - name: Install OPA
        run: |
          curl -L -o opa "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Run policy tests
        run: opa test policy/ -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cac-demo:ci .
      - name: Smoke test (non-root, serves /healthz)
        run: |
          test "$(docker run --rm --entrypoint id cac-demo:ci -u)" = "10001"
          docker run -d --name app -p 8000:8000 -e API_KEYS=ci cac-demo:ci
          for i in $(seq 10); do curl -fs localhost:8000/healthz && exit 0; sleep 1; done
          docker logs app; exit 1

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
